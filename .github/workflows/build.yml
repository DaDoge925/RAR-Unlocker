name: Build RAR-Unlocker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install ATL
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        & "$vsPath\VC\Auxiliary\Build\vcvarsall.bat" x86
        choco install visualstudio2022-workload-vctools --params "--add Microsoft.VisualStudio.Workload.VCTools" -y
      shell: cmd

    - name: Build solution
      run: msbuild "RAR Unlocker.sln" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rar-unlocker-release
        path: Release/

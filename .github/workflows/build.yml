name: Build RAR-Unlocker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest  # Use Windows since this is a Windows application

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1
    
    - name: Build
      run: msbuild rar_unlocker.sln /p:Configuration=Release /p:Platform=x64
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: rar-unlocker
        path: x64/Release/rar_unlocker.exe
